arming_manager_parameters:
  heartbeat_timeout_ms:
    type: int
    default_value: 100
    description: "Maximum allowed sensor message age in milliseconds"
    read_only: true
    validation:
      bounds<>: [50, 2000]
  
  min_arm_voltage_v:
    type: double
    default_value: 7.2
    description: "minimal battery voltage required for arming"
    additional_constraints: "Applicable to a 2S Li-ion battery pack"
    read_only: true
    validation:
      bounds<>: [7.0, 7.4]

  min_obstacle_dist_m:
    type: double
    default_value: 0.3
    description: "minimal safe obstacle distance required arming"
    read_only: true
    validation:
      bounds<>: [0.3, 1.0]
