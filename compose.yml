
services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: lyrical
        USERNAME: ros
        USER_UID: ${USER_UID:?Set USER_UID in .env}
        USER_GID: ${USER_GID:?Set USER_GID in .env}

    image: ros2_practical:lyrical
    container_name: ros2_practical_dev_container

    network_mode: host
    ipc: host

    volumes:
      - ./ros2-ws:/ros2-ws
      - /tmp/.X11-unix:/tmp/.X11-unix:ro  # Allow GUI applications to connect to the host X server. 
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/gpiochip0:/dev/gpiochip0
    group_add:
      - "${I2C_GID:?I2C_GID is required}"

    environment:
      ROS_DOMAIN_ID: "42"
      ROS_LOCALHOST_ONLY: "0"
      DISPLAY: ${DISPLAY:-:0}
      QT_QPA_PLATFORM: xcb

    stdin_open: true
    tty: true

    command: sleep infinity
